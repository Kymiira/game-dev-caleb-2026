<!DOCTYPE html>
<html lang="en" data-theme="purple">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Funky Tables</title>
    <link rel="stylesheet" href="../../utils/styles.css">
    <script src="../../utils/scripts.js" defer></script>
    <script src="t1a01-table-caleb.js" defer></script>
</head>
<body>
    <header>
        <h1>T1A01 funky tables</h1>
        <nav>
            <a href="../../index-src/">Index</a>
        </nav>
    </header>

    <main>
        <div class="collapsible-row">
            <section class="collapsible">
                <button class="collapsible-toggle" type="button" aria-expanded="true" aria-controls="ticTacToeGame">
                    <span class="collapsible-icon">-</span> tic tac toe board - please click a cell
                </button>
                <div class="collapsible-content" id="ticTacToeGame">
                    <div class="collapsible-inner" style="text-align: center;">
                        <div id="ttt-status" style="margin-bottom: 10px; font-weight: bold; color: var(--text-color-2);">your turn</div>
                        
                        <table class="funky-table" id="tictactoe-board">
                            <caption>3x3 Grid</caption>
                            <tr>
                                <td onclick="makeMove(0)" style="cursor: pointer;"></td>
                                <td onclick="makeMove(1)" style="cursor: pointer;"></td>
                                <td onclick="makeMove(2)" style="cursor: pointer;"></td>
                            </tr>
                            <tr>
                                <td onclick="makeMove(3)" style="cursor: pointer;"></td>
                                <td onclick="makeMove(4)" style="cursor: pointer;"></td>
                                <td onclick="makeMove(5)" style="cursor: pointer;"></td>
                            </tr>
                            <tr>
                                <td onclick="makeMove(6)" style="cursor: pointer;"></td>
                                <td onclick="makeMove(7)" style="cursor: pointer;"></td>
                                <td onclick="makeMove(8)" style="cursor: pointer;"></td>
                            </tr>
                        </table>
                        <button type="button" class="collapsible-toggle" style="margin: 0 auto; padding: 0.5rem 1rem; width: auto;" onclick="resetGame()">reset board</button>
                    </div>
                </div>
            </section>

            <section class="collapsible">
                <button class="collapsible-toggle" type="button" aria-expanded="true" aria-controls="incTables">
                    <span class="collapsible-icon">-</span> Increasingly Large Tables
                </button>
                <div class="collapsible-content" id="incTables">
                    <div class="collapsible-inner">
                        <table class="funky-table">
                            <caption>1x2</caption>
                            <thead>
                                <tr>
                                    <th scope="col">Tile 1</th>
                                    <th scope="col">Tile 2</th>
                                </tr>
                            </thead>
                        </table>

                        <table class="funky-table">
                            <caption>2x2</caption>
                            <thead>
                                <tr>
                                    <th scope="col">Tile 1</th>
                                    <th scope="col">Tile 2</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td>Tile 3</td>
                                    <td>Tile 4</td>
                                </tr>
                            </tbody>
                        </table>
                        
                        <table class="funky-table">
                            <caption>2x3</caption>
                            <thead>
                                <tr>
                                    <th scope="col">Tile 1</th>
                                    <th scope="col">Tile 2</th>
                                    <th scope="col">Tile 3</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td>Tile 4</td>
                                    <td>Tile 5</td>
                                    <td>Tile 6</td>
                                </tr>
                            </tbody>
                        </table>

                        <table class="funky-table">
                            <caption>3x4</caption>
                            <thead>
                                <tr>
                                    <th scope="col">Tile 1</th>
                                    <th scope="col">Tile 2</th>
                                    <th scope="col">Tile 3</th>
                                    <th scope="col">Tile 4</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td>Tile 5</td>
                                    <td>Tile 6</td>
                                    <td>Tile 7</td>
                                    <td>Tile 8</td>
                                </tr>
                                <tr>
                                    <td>Tile 9</td>
                                    <td>Tile 10</td>
                                    <td>Tile 11</td>
                                    <td>Tile 12</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>

            <section class="collapsible">
                <button class="collapsible-toggle" type="button" aria-expanded="true" aria-controls="otherTables">
                    <span class="collapsible-icon">-</span> other tables
                </button>
                <div class="collapsible-content" id="otherTables">
                    <div class="collapsible-inner">
                        <table class="funky-table">
                            <caption>Link</caption>
                            <thead>
                                <tr>
                                    <th scope="col"><a href="https://happywhales.com">happy whales</a></th>
                                </tr>
                            </thead>
                        </table>

                        <table class="funky-table">
                            <caption>image</caption>
                            <thead>
                                <tr>
                                    <th scope="col"><img src="https://th.bing.com/th/id/OIP.1wApEJQvwcEZIVWuvaSwlAHaE8?w=299&h=200&c=7&r=0&o=7&pid=1.7&rm=3" alt="Whale" style="max-width: 100%; height: auto;"></th>
                                </tr>
                            </thead>
                        </table>
                    </div>
                </div>
            </section>
        </div>
    </main>
</body>
</html>
