<head>
    <script defer>
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('trainPower').addEventListener('click', trainHero);
            document.getElementById('earnCash').addEventListener('click', earnCashHero);
            document.getElementById('buyPotion').addEventListener('click', buyHealthPotionHero);
            document.getElementById('usePotion').addEventListener('click', healHero);
            document.getElementById('reset').addEventListener('click', resetGame);

            let myHero = {
                name: "Captain Code",
                comment: "Ready to Train!",
                pwr: 100,
                pwrCap: 100,
                g: 0,
                hp: 100,
                hpCap: 100,
                potion: 0,
                healCount: 0,
                xp: 0,
                lvl: 0,
                dead: false
            };

            function trainHero() {
                if (myHero.dead) {
                    myHero.comment = "You're dead! Press Reset.";
                    return;
                }
                myHero.pwr += 10;
                myHero.hp -= 10;
                myHero.comment = `You got stronger and are now at ${myHero.pwr} power!`;
            }

            function earnCashHero() {
                if (myHero.dead) {
                    myHero.comment = "You're dead! Press Reset.";
                    return;
                }
                if (myHero.pwr < 10) {
                    myHero.dead = true;
                    myHero.comment = "Not enough power to earn gold! You died.";
                    return;
                }
                myHero.g += 10;
                myHero.pwr -= 10;
                myHero.comment = `You earned gold! Now you have ${myHero.g}g.`;
            }

            function buyHealthPotionHero() {
                if (myHero.dead) {
                    myHero.comment = "You're dead! Press Reset.";
                    return;
                }
                if (myHero.g < 25) {
                    myHero.comment = "You don't have enough gold to buy this, you need 25g!";
                } else {
                    myHero.g -= 25;
                    myHero.potion += 1;
                    myHero.comment = `You bought a potion! You now have ${myHero.potion} potions, and ${myHero.g} gold!`;
                }
            }

            function healHero() {
                if (myHero.dead) {
                    myHero.comment = "You're dead! Press Reset.";
                    return;
                }
                if (myHero.potion <= 0) {
                    myHero.comment = `You can't heal, you have ${myHero.potion} potions!`;
                } else {
                    myHero.potion -= 1;
                    myHero.hp += 25;
                    myHero.xp += 25;
                    myHero.comment = `You healed and are now at ${myHero.hp} health!`;
                }
            }

            function levelHero() {
                if (myHero.xp >= 100) {
                    myHero.lvl += 1; 
                    myHero.hpCap += 50; 
                    myHero.pwrCap += 50;
                    myHero.xp -= 100;
                    myHero.comment = `Level Up! You are now Level ${myHero.lvl}.`;
                }
            }

            function resetGame() {
                location.reload();
            }

            function loop() {
                if (!myHero.dead) {
                    if (myHero.pwr > myHero.pwrCap) { myHero.pwr = myHero.pwrCap; }
                    if (myHero.hp > myHero.hpCap) { myHero.hp = myHero.hpCap; }
                    
                    if (myHero.hp <= 0) {
                        myHero.hp = 0;
                        myHero.dead = true;
                        myHero.comment = "You have died! Click 'Reset if dead'.";
                    } else {
                        levelHero();
                    }
                }
                
                document.getElementById('myDiv').innerHTML = myHero.comment;
                
                document.getElementById('statTracker').innerHTML = `lvl ${myHero.lvl}, ${myHero.hp}/${myHero.hpCap}hp, ${myHero.pwr}/${myHero.pwrCap}pwr, ${myHero.g}g, ${myHero.potion} potions, ${myHero.xp}/100xp`;
                
                requestAnimationFrame(loop);
            }
            
            loop();
        });
    </script>
</head>
<body>
    <header>
        <h1 align="center">t1a16-powerup-caleb</h1>
    </header>
    <main>
        <input type="button" value="Train Hero power" id="trainPower">
        <input type="button" value="Earn gold" id="earnCash">
        <input type="button" value="Buy a potion" id="buyPotion">
        <input type="button" value="Use a potion" id="usePotion">
        <input type="button" value="Reset if dead" id="reset"><br>
        <div id="statTracker">...</div>
        <div id="myDiv">...</div>
    </main>
</body>
