<!DOCTYPE html>
<html lang=en>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Funky Tables</title>
        <style>
            body {font-family: 'Inter', sans-serif;}
        </style>
    </head>
    <body>
        <header>
            <h1 align=center>Funky Tables</h1>
        </header>
        <hr>
        <main>
            <div align="center">
                <table border="1">
                    <caption>
                        1x2
                    </caption>
                    <thead>
                        <tr>
                            <td scope="col">Tile 1</td>
                            <td scope="col">Tile 2</td>
                        </tr>
                    </thead>
                </table>

                <table border="1">
                    <caption>
                        2x2
                    </caption>
                    <thead>
                        <tr>
                            <td scope="col">Tile 1</td>
                            <td scope="col">Tile 2</td>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td scope="row">Tile 3</td>
                            <td>Tile 4</td>
                        </tr>
                    </tbody>
                </table>
                
                <table border="1">
                    <caption>
                        2x3
                    </caption>
                    <thead>
                        <tr>
                            <td scope="col">Tile 1</td>
                            <td scope="col">Tile 2</td>
                            <td scope="col">Tile 3</td>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td scope="row">Tile 4</td>
                            <td>Tile 5</td>
                            <td>Tile 6</td>
                        </tr>
                    </tbody>
                </table>

                <table border="1">
                    <caption>
                        3x4
                    </caption>
                    <thead>
                        <tr>
                            <td>Tile 1</td>
                            <td>Tile 2</td>
                            <td>Tile 3</td>
                            <td>Tile 4</td>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Tile 5</td>
                            <td>Tile 6</td>
                            <td>Tile 7</td>
                            <td>Tile 8</td>
                        </tr>
                        <tr>
                            <td>Tile 9</td>
                            <td>Tile 10</td>
                            <td>Tile 11</td>
                            <td>Tile 12</td>
                        </tr>
                    </tbody>
                </table>

                <table border="0">
                    <caption>
                        image
                    </caption>
                    <thead>
                        <tr>
                            <td><a href="..."></a></td>
                        </tr>
                    </thead>
                </table>
            </div>
        </main>
    </body>
</html>
