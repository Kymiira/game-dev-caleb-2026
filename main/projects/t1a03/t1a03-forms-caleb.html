<!DOCTYPE html>
<html lang="en" data-theme="gothic">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Freaky Forms</title>
        <link rel="stylesheet" href="../../utils/styles.css">
        <script src="t1a03-forms-caleb.js" defer></script>
    </head>
    <body>
        <header>
            <h1>T1a03 Freaky Forms</h1>
            <nav>
                <a href="../../index-src/">Index</a>
            </nav>
        </header>

        <main>
            <section class="centered">
                The following are all form elements (add to them):<br>
                <form>
                    <label for="fName">Enter First Name:</label>
                    <input type="text" id="fName" placeholder="Caleb"><br>

                    Is this your name? 
                    <input type="checkbox" id="yBox" onchange="doSomething('c')">Yes 
                    <input type="checkbox" id="nBox" onchange="doSomething('d')">No<br>

                    You're 100% sure? 
                    <input type="radio" name="surety" onclick="doSomething('radio-yes')">Yes
                    <input type="radio" name="surety" onclick="doSomething('radio-no')">No<br>

                    hidden:<input type="hidden"><br>
                    file:<input type="file"><br>
                    reset:<input type="reset"><br>
                    submit:<input type="submit"><br>
                    input button:<input type="button" id="button" value="click me i dare you" onclick="doSomething('a')"><br>

                    button tag: <button type="button" onclick="doSomething('a')">Real Button Tag</button><br>

                    textArea:<textarea id="tArea" cols="1" rows="1" oninput="doSomething('textarea-change')">this works broski</textarea><br>

                    selectBox:
                    <select id="select" size="2" onchange="doSomething('b')">
                        <optgroup label="Group 1">
                            <option value="person">Person</option>
                        </optgroup>
                    </select><br>

                    datalist: <input list="ice-cream-flavors" name="iceCream">
                    <datalist id="ice-cream-flavors">
                        <option value="Chocolate">
                        <option value="Coconut">
                        <option value="Mint">
                    </datalist><br>

                    <fieldset>
                        <legend>Extra Metrics</legend>
                        
                        output: <output name="result">42</output><br>

                        meter: <meter id="myMeter" value="0.6" min="0" max="1">60%</meter><br>

                        progress: <progress id="myProgress" value="70" max="100">70%</progress>
                    </fieldset>
                </form>
            </section>
        </main>
    </body>
</html>
