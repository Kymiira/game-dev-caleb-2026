<!DOCTYPE html>
<html lang="en" data-theme="purple">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>guess the number - inputs and outputs</title>
    <link rel="stylesheet" href="../../utils/styles.css">
    <link rel="stylesheet" href="t1a05-input-output-caleb.css">
    <script src="t1a05-input-output-caleb.js" defer></script>
    <script src="../../utils/scripts.js" defer></script>
</head>
<body>
    <header>
        <h1>t1a05-input-output-caleb</h1>
        <nav>
            <a href="../../index-src/">index</a>
        </nav>
    </header>

    <main>
        <div class="collapsible-row">

            <section class="collapsible">
                <button class="collapsible-toggle" type="button" aria-expanded="true" aria-controls="setupPanel">
                    <span>setup</span>
                    <span class="collapsible-icon">-</span>
                </button>
                <div class="collapsible-content" id="setupPanel">
                    <div class="collapsible-inner">
                        <p>player: <output id="playerNameOut">?</output></p>
                        <p>wins: <output id="winsOut">0</output> | best score: <output id="bestOut">-</output></p>

                        <fieldset>
                            <legend>game settings</legend>
                            <p>
                                <label for="difficultySelect">difficulty:</label>
                                <select id="difficultySelect">
                                    <option value="easy">easy (1-10)</option>
                                    <option value="medium">medium (1-50)</option>
                                    <option value="hard">hard (1-100)</option>
                                </select>
                            </p>
                            <p>
                                <label for="triesRange">max tries: <output id="triesRangeOut">7</output></label>
                                <input type="range" id="triesRange" min="3" max="15" value="7">
                            </p>
                            <p>
                                <input type="checkbox" id="hintsCheck" checked>
                                <label for="hintsCheck">show hints</label>
                            </p>
                        </fieldset>

                        <p>
                            <button type="button" id="saveButton">save player (json)</button>
                            <label for="fileInput" class="file-label" style="display:inline-block;background:var(--prim-color);color:var(--text-color-2);border:1px solid var(--accent-color);border-radius:6px;padding:0.5rem 1rem;font:inherit;font-weight:600;cursor:pointer;margin-top:0.5rem;">load json</label>
                            <input type="file" id="fileInput" accept=".json" style="display:none;">
                        </p>
                    </div>
                </div>
            </section>

            <section class="collapsible">
                <button class="collapsible-toggle" type="button" aria-expanded="true" aria-controls="gamePanel">
                    <span>game</span>
                    <span class="collapsible-icon">-</span>
                </button>
                <div class="collapsible-content" id="gamePanel">
                    <div class="collapsible-inner">
                        <p>i'm thinking of a number from <output id="rangeOut">1 to 10</output>.</p>

                        <p>
                            <label for="guessInput">your guess:</label>
                            <input type="number" id="guessInput" min="1" max="10" step="1">
                            <button type="button" id="guessButton">guess</button>
                        </p>

                        <p><output id="hintOut" for="guessInput" aria-live="polite">make a guess!</output></p>

                        <p>
                            <label for="triesProgress">tries left:</label>
                            <progress id="triesProgress" value="7" max="7">7</progress>
                        </p>

                        <h3>guess history</h3>
                        <ol id="historyList"></ol>

                        <p>
                            <button type="button" id="newGameButton">new game</button>
                            <button type="button" id="copyButton">copy score</button>
                        </p>
                    </div>
                </div>
            </section>

            <section class="collapsible">
                <button class="collapsible-toggle" type="button" aria-expanded="true" aria-controls="advancedPanel">
                    <span>advanced i/o</span>
                    <span class="collapsible-icon">-</span>
                </button>
                <div class="collapsible-content" id="advancedPanel">
                    <div class="collapsible-inner">
                        <p>click thermometer to guess:</p>
                        <canvas id="thermoCanvas" width="150" height="180" style="background:var(--bg-color);border:1px solid var(--border-color);border-radius:8px;cursor:pointer;display:block;margin:0 auto;"></canvas>
                        <p style="text-align:center;margin-top:0.75rem;"><button type="button" id="speakButton">speak hint</button></p>
                    </div>
                </div>
            </section>

        </div>
    </main>

    <dialog id="winDialog" style="background:var(--surf-color);color:var(--text-color-2);border:1px solid var(--accent-color);border-radius:8px;padding:1.5rem;max-width:300px;">
        <div class="collapsible-inner" style="background:transparent;padding:0;">
            <h3 style="margin-top:0;">you won!</h3>
            <p id="dialogMsg"></p>
            <button type="button" id="closeDialog">play again</button>
        </div>
    </dialog>

    <footer>
        <p><a href="../../index-src/index.html">index</a></p>
    </footer>
</body>
</html>
