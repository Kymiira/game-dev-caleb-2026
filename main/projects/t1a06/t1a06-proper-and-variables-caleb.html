<!DOCTYPE html>
<html lang="en" data-theme="purple">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>t1a06 - Advanced Variables & Game State Engine</title>
    <link rel="stylesheet" href="../../utils/styles.css">
    <link rel="stylesheet" href="t1a06-proper-and-variables-caleb.css">
    <script src="../../utils/scripts.js" defer></script>
    <script src="t1a06-proper-and-variables-caleb.js" defer></script>
</head>
<body>
    <header>
        <h1>T1a06: Advanced Game Variables & State Engine</h1>
        <nav>
            <a href="../../index-src/">Index</a>
        </nav>
    </header>

    <main>
        <div class="collapsible-row">
            <section class="collapsible">
                <button class="collapsible-toggle" type="button" aria-expanded="true" aria-controls="gameEnginePanel">
                    <span class="collapsible-icon">-</span> RPG State & Inventory Engine
                </button>
                <div class="collapsible-content" id="gameEnginePanel">
                    <div class="collapsible-inner">
                        <div id="player-hud" class="hud-box">
                        </div>
                        <div class="action-button-group">
                            <button type="button" class="collapsible-toggle" onclick="earnGold()">Mine Gold (+25.5)</button>
                            <button type="button" class="collapsible-toggle" onclick="buyItem('Health Elixir', 50)">Buy Elixir (50G)</button>
                            <button type="button" class="collapsible-toggle" onclick="toggleGodMode()">Toggle God Mode</button>
                            <button type="button" class="collapsible-toggle" onclick="triggerQuest()">Advance Quest</button>
                        </div>
                        <div id="inventory-grid" class="inventory-container">
                        </div>
                    </div>
                </div>
            </section>

            <section class="collapsible">
                <button class="collapsible-toggle" type="button" aria-expanded="true" aria-controls="inspectorPanel">
                    <span class="collapsible-icon">-</span> Live Variable Inspector
                </button>
                <div class="collapsible-content" id="inspectorPanel">
                    <div class="collapsible-inner">
                        <table class="funky-table" id="variable-inspector-table">
                            <caption>Runtime Memory Map</caption>
                            <thead>
                                <tr>
                                    <th>Variable Name</th>
                                    <th>Data Type</th>
                                    <th>Current Value</th>
                                </tr>
                            </thead>
                            <tbody>
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </div>

        <section class="collapsible">
            <button class="collapsible-toggle" type="button" aria-expanded="true" aria-controls="terminalPanel">
                <span class="collapsible-icon">-</span> Engine Terminal Output
            </button>
            <div class="collapsible-content" id="terminalPanel">
                <div class="collapsible-inner">
                    <div id="terminal-log" class="terminal-screen">
                        [System] Engine initialized successfully...<br>
                    </div>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
