<!DOCTYPE html>
<html lang="en" data-theme="purple">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>decisions - comparison lab</title>
    <link rel="stylesheet" href="../../utils/styles.css">
    <link rel="stylesheet" href="t1a07-decisions-caleb.css">
    <script src="t1a07-decisions-caleb.js" defer></script>
    <script src="../../utils/scripts.js" defer></script>
</head>
<body>
    <header>
        <h1>t1a07-decisions-caleb</h1>
        <nav>
            <a href="../../index-src/">index</a>
        </nav>
    </header>

    <main>
        <section class="collapsible">
            <button class="collapsible-toggle" type="button" aria-expanded="true" aria-controls="cmpPanel">
                <span>if: comparison lab</span>
                <span class="collapsible-icon">-</span>
            </button>
            <div class="collapsible-content" id="cmpPanel">
                <div class="collapsible-inner">
                    <p>
                        <label for="presetSel">try a preset:</label>
                        <select id="presetSel">
                            <option value="">pick one...</option>
                        </select>
                    </p>

                    <div class="cmp-row">
                        <div class="cmp-col">
                            <label for="typeA">type of a</label>
                            <select id="typeA">
                                <option value="int" selected>int</option>
                                <option value="float">float</option>
                                <option value="string">string</option>
                                <option value="bool">bool</option>
                                <option value="null">null</option>
                                <option value="undefined">undefined</option>
                                <option value="nan">nan</option>
                                <option value="array">array</option>
                            </select>
                            <label for="valA">value of a</label>
                            <input type="text" id="valA" value="5" autocomplete="off">
                        </div>

                        <div class="cmp-col op">
                            <label for="opSel">operator</label>
                            <select id="opSel">
                                <option value="==">== loose</option>
                                <option value="===">=== strict</option>
                                <option value="!=">!= loose</option>
                                <option value="!==">!== strict</option>
                            </select>
                        </div>

                        <div class="cmp-col">
                            <label for="typeB">type of b</label>
                            <select id="typeB">
                                <option value="int">int</option>
                                <option value="float">float</option>
                                <option value="string" selected>string</option>
                                <option value="bool">bool</option>
                                <option value="null">null</option>
                                <option value="undefined">undefined</option>
                                <option value="nan">nan</option>
                                <option value="array">array</option>
                            </select>
                            <label for="valB">value of b</label>
                            <input type="text" id="valB" value="5" autocomplete="off">
                        </div>
                    </div>

                    <pre id="codeOut"></pre>

                    <p><output id="resOut" for="typeA valA opSel typeB valB" aria-live="polite"></output></p>

                    <p>types: <span id="typesOut">-</span></p>
                    <p>why: <span id="whyOut">-</span></p>
                    <p>errors: <span id="errOut">none</span></p>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p><a href="../../index-src/index.html">index</a></p>
    </footer>
</body>
</html>
